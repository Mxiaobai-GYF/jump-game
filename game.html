<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素跳跃</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a0015, #1a0040, #0d1b3e, #000);
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,255,255,0.08), 0 0 120px rgba(180,0,255,0.05);
  }
  canvas {
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gc"></canvas>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = 400, H = 660;
canvas.width = W; canvas.height = H;

/* ─── 配置 ─── */
const SERVER_URL = "http://127.0.0.1:8000";
const params = new URLSearchParams(window.location.search);
const PLAYER_ID = params.get("player_id") || "";

const GRAVITY = 0.55;
const JUMP_BASE = 7;
const JUMP_MAX = 15;
const CHARGE_RATE = 0.3;
const MAX_CHARGE = 100;
const MIN_CHARGE = 2;
const PS = 22;        // player size
const PW = 72, PH = 14;

const PCOLORS = ["#667eea","#f093fb","#4facfe","#43e97b","#fa709a","#fee140","#a8edea","#a18cd1"];

/* ─── 状态 ─── */
let state = "playing";
let score = 0, bestScore = parseInt(localStorage.getItem("jumpBest")) || 0;
let player = { x:0, y:0, vx:0, vy:0, grounded:false, rot:0 };
let plats = [], stars = [], parts = [], camY = 0;
let charging = false, power = 0, startX = 0, dDir = 0, dOff = 0;
let pvx = 0, pvy = 0;
let lbData = null, lbOK = false, lbErr = false;

/* ─── 重置 ─── */
function reset() {
  state = "playing"; score = 0;
  plats = []; stars = []; parts = []; camY = 0;
  charging = false; power = 0; dDir = 0; dOff = 0;
  lbData = null; lbOK = false; lbErr = false;

  const sp = { x:W/2-60, y:H-90, w:120, h:PH, color:PCOLORS[0], scored:false };
  plats.push(sp);
  player.x = sp.x + sp.w/2 - PS/2;
  player.y = sp.y - PS;
  player.vx = 0; player.vy = 0; player.grounded = true; player.rot = 0;
  genUp(-H*2);
}

function genUp(limit) {
  while (plats[plats.length-1].y > limit) {
    const l = plats[plats.length-1];
    const ny = l.y - (60 + Math.random()*50);
    const w = PW - Math.random()*16;
    const x = Math.random()*(W-w);
    const c = PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
    plats.push({ x, y:ny, w, h:PH, color:c, scored:false });
    if (Math.random() < 0.28) {
      stars.push({ x:x+w/2, y:ny-35-Math.random()*25, s:10, rot:0, got:false });
    }
  }
}

function updatePreview() {
  const jf = Math.min(JUMP_BASE + power*0.12, JUMP_MAX);
  pvy = -jf;
  pvx = dDir * (dOff/100) * 5;
}

/* ─── 更新 ─── */
function update() {
  if (state !== "playing") return;

  if (charging && player.grounded) {
    power = Math.min(power + CHARGE_RATE, MAX_CHARGE);
    updatePreview();
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;
  if (!player.grounded) player.rot += player.vx * 0.06;

  if (player.x < 0) { player.x = 0; player.vx *= -0.3; }
  if (player.x > W-PS) { player.x = W-PS; player.vx *= -0.3; }

  player.grounded = false;
  const pb = player.y + PS, pcx = player.x + PS/2;
  for (const p of plats) {
    if (player.vy >= 0 && pcx > p.x && pcx < p.x+p.w &&
        pb >= p.y && pb <= p.y + p.h + player.vy + 12) {
      player.y = p.y - PS; player.vy = 0;
      player.vx *= 0.85; player.grounded = true;
      if (!p.scored) {
        p.scored = true; score++;
        spawnPart(player.x+PS/2, player.y+PS, "#ffd700", 6);
      }
      break;
    }
  }
  if (player.grounded && Math.abs(player.rot) > 0.1) player.rot *= 0.85;
  else if (player.grounded) player.rot = 0;

  for (const s of stars) {
    if (!s.got && Math.hypot(pcx-s.x, player.y+PS/2-s.y) < s.s + PS/2) {
      s.got = true; score += 5;
      spawnPart(s.x, s.y, "#ffd700", 10);
    }
  }

  const ty = player.y - H*0.35;
  if (ty < camY) {
    camY += (ty - camY) * 0.08;
    if (plats[plats.length-1].y > camY - 200) genUp(camY - 200);
    plats = plats.filter(p => p.y < camY + H + 100);
    stars = stars.filter(s => s.y < camY + H + 100 && !s.got);
  }

  parts = parts.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.03;
    return p.life > 0;
  });
  if (parts.length > 300) parts = parts.slice(-200);
  for (const s of stars) s.rot += 0.03;

  if (player.y > camY + H + 60) { gameOver(); }
}

function spawnPart(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    parts.push({ x, y, vx:Math.cos(a)*spd, vy:-Math.sin(a)*spd-1,
                 life:1, color, size:2+Math.random()*2 });
  }
}

function checkStarCol(s) {
  const pcx = player.x + PS/2, pcy = player.y + PS/2;
  return Math.hypot(pcx - s.x, pcy - s.y) < s.s + PS/2;
}

/* ─── 游戏结束 ─── */
function gameOver() {
  if (state === "gameover") return;
  state = "gameover";
  if (score > bestScore) { bestScore = score; localStorage.setItem("jumpBest", bestScore); }

  lbOK = false; lbData = null; lbErr = false;

  // 提交分数
  if (PLAYER_ID) {
    fetch(`${SERVER_URL}/submit_score`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ player_id: PLAYER_ID, score })
    }).catch(() => {}).then(() => {
      // 拉取排行榜
      fetch(`${SERVER_URL}/leaderboard`)
        .then(r => r.json())
        .then(d => { lbData = d; lbOK = true; })
        .catch(() => { lbErr = true; lbOK = true; });
    });
  } else {
    lbErr = true; lbOK = true;
  }
}

/* ─── 绘制 ─── */
function draw() {
  /* 背景 */
  for (let y = 0; y < H; y++) {
    const t = y / H;
    const r = Math.round(26*(1-t) + 15*t);
    const g = Math.round(26*(1-t) + 52*t);
    const b = Math.round(46*(1-t) + 96*t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, W, 1);
  }

  /* 背景星星 */
  const seed = 7919;
  for (let i = 0; i < 40; i++) {
    const sx = (i*seed*13) % W;
    const sy = ((i*seed*17) % (H*3) + Date.now()*0.003*(i%3+1)) % (H*2) - camY*0.05;
    if (sy >= 0 && sy <= H) {
      ctx.fillStyle = `rgba(255,255,255,${0.15+(i%5)*0.05})`;
      ctx.beginPath(); ctx.arc(sx, sy, 1+(i%2), 0, Math.PI*2); ctx.fill();
    }
  }

  /* 粒子 */
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - camY, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 平台 */
  for (const p of plats) {
    const y = p.y - camY;
    if (y + p.h < 0 || y > H) continue;
    ctx.fillStyle = p.color;
    roundRect(p.x, y, p.w, p.h, 6);
    ctx.fill();
    // 高光
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    roundRect(p.x+4, y+2, p.w-8, 3, 2);
    ctx.fill();
  }

  /* 星星 */
  for (const s of stars) {
    if (s.got) continue;
    const y = s.y - camY;
    ctx.save();
    ctx.translate(s.x, y);
    ctx.rotate(s.rot);
    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i*4*Math.PI)/5 - Math.PI/2;
      ctx.lineTo(Math.cos(a)*s.s, Math.sin(a)*s.s);
      const ia = a + Math.PI/5;
      ctx.lineTo(Math.cos(ia)*s.s*0.4, Math.sin(ia)*s.s*0.4);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* 抛物线预览 */
  if (charging) {
    drawTrajectory();
  }

  /* 玩家 */
  const px = player.x + PS/2, py = player.y + PS/2 - camY;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.rot);

  // 阴影
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(2, 3, PS/2, PS/2.6, 0, 0, Math.PI*2); ctx.fill();

  // 身体
  const grad = ctx.createRadialGradient(0,-2,0,0,0,PS/2);
  grad.addColorStop(0, "#fff"); grad.addColorStop(1, "#ddd");
  ctx.fillStyle = grad;
  ctx.shadowColor = "rgba(255,255,255,0.3)"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(0, 0, PS/2, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // 眼睛
  ctx.fillStyle = "#333";
  ctx.beginPath(); ctx.arc(-4, -2.5, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -2.5, 2.2, 0, Math.PI*2); ctx.fill();

  // 腮红
  ctx.fillStyle = "rgba(255,150,150,0.3)";
  ctx.beginPath(); ctx.ellipse(-7, 2, 3, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, 2, 3, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  /* 力度条 */
  if (charging) {
    const bw = 160, bh = 14;
    const bx = (W-bw)/2, by = H - 50;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    roundRect(bx, by, bw, bh, 7); ctx.fill();

    const fw = bw * (power / MAX_CHARGE);
    if (fw > 0) {
      const r = power/MAX_CHARGE;
      let cr, cg, cb;
      if (r < 0.5) { const t=r*2; cr=74+132*t; cg=222-42*t; cb=128-113*t; }
      else { const t=(r-0.5)*2; cr=250+5*t; cg=180-130*t; cb=15-15*t; }
      ctx.fillStyle = `rgb(${cr|0},${cg|0},${cb|0})`;
      roundRect(bx, by, fw, bh, 7); ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 7); ctx.stroke();

    ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`力度: ${power|0}`, W/2, by-8);
  }

  /* 得分 */
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "left"; ctx.fillText(`得分: ${score}`, 16, 32);
  ctx.textAlign = "right"; ctx.fillText(`最高: ${bestScore}`, W-16, 32);

  /* 提示 */
  if (player.grounded && !charging && state === "playing") {
    const a = 0.3 + 0.2 * Math.sin(Date.now() * 0.004);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = "13px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("按住鼠标蓄力，滑动改变抛物线方向", W/2, H-80);
  }

  /* 游戏结束画面 */
  if (state === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#fff"; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("游戏结束", W/2, 70);
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 26px sans-serif";
    ctx.fillText(`本局得分: ${score}`, W/2, 110);
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "16px sans-serif";
    ctx.fillText(`历史最高: ${bestScore}`, W/2, 140);

    // 排行榜
    drawLeaderboard();

    // 按钮
    ctx.fillStyle = "#4facfe"; roundRect(W/2-70, H-70, 140, 40, 20); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("再来一局", W/2, H-45);
  }
}

function drawTrajectory() {
  const px = player.x + PS/2, py = player.y + PS/2 - camY;
  let sx = px, sy = py, svx = pvx, svy = pvy;
  const pts = [];
  for (let i = 0; i < 50; i++) {
    pts.push([sx, sy]);
    svy += GRAVITY; sx += svx; sy += svy;
    if (sy > H+100) break;
  }
  const color = dDir === 1 ? "#4facfe" : "#f093fb";
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = pts[i];
    if (y < 0 || y > H) continue;
    const a = 0.7 - (i/pts.length)*0.5;
    const r = Math.max(3 - (i/pts.length)*2, 1.5);
    ctx.globalAlpha = a;
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  // 落点
  if (pts.length > 3) {
    const [ex, ey] = pts[pts.length-1];
    ctx.fillStyle = "#ffd700";
    ctx.shadowColor = "#ffd700"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawLeaderboard() {
  const titleY = 175;
  ctx.fillStyle = "#ffd700"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("排行榜 TOP 10", W/2, titleY);

  if (!lbOK) {
    ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "13px sans-serif";
    ctx.fillText("加载中...", W/2, titleY+28);
    return;
  }
  if (lbErr || !lbData || lbData.length === 0) {
    ctx.fillStyle = "#ff4d6a"; ctx.font = "13px sans-serif";
    ctx.fillText("排行榜加载失败", W/2, titleY+28);
    return;
  }

  const startY = titleY + 22;
  for (let i = 0; i < Math.min(lbData.length, 10); i++) {
    const e = lbData[i];
    const y = startY + i * 26;
    const rank = `第${i+1}名`;
    const name = e.username;
    const sc = `${e.score}分`;

    ctx.textAlign = "right";
    ctx.fillStyle = i < 3 ? "#ffd700" : "rgba(255,255,255,0.5)";
    ctx.font = "13px sans-serif";
    ctx.fillText(rank, W/2-60, y);

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "13px sans-serif";
    ctx.fillText(name, W/2-50, y);

    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd700";
    ctx.fillText(sc, W/2+50, y);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

/* ─── 鼠标事件 ─── */
canvas.addEventListener("mousedown", e => {
  if (state === "playing" && player.grounded) {
    charging = true; power = 0; startX = e.clientX;
    dDir = 0; dOff = 0; updatePreview();
  }
});
canvas.addEventListener("mousemove", e => {
  if (!charging) return;
  const dx = e.clientX - startX, maxD = 80;
  dOff = Math.min(Math.abs(dx)/maxD, 1)*100;
  dDir = dx < -10 ? 1 : dx > 10 ? -1 : 0;
  updatePreview();
});
canvas.addEventListener("mouseup", () => {
  if (!charging) return;
  charging = false;
  if (power >= MIN_CHARGE && player.grounded) {
    player.vy = pvy; player.vx = pvx; player.grounded = false;
    spawnPart(player.x+PS/2, player.y+PS, "rgba(180,200,255)", 5);
  }
  power = 0; dDir = 0; dOff = 0;
});
canvas.addEventListener("mouseleave", () => {
  if (charging) {
    charging = false;
    if (power >= MIN_CHARGE && player.grounded) {
      player.vy = pvy; player.vx = pvx; player.grounded = false;
      spawnPart(player.x+PS/2, player.y+PS, "rgba(180,200,255)", 5);
    }
    power = 0; dDir = 0; dOff = 0;
  }
});

/* 再来一局（点击） */
canvas.addEventListener("click", e => {
  if (state === "gameover") {
    const bx = W/2-70, by = H-70, bw = 140, bh = 40;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx >= bx && mx <= bx+bw && my >= by && my <= by+bh) {
      reset();
    }
  }
});

/* 触摸事件（移动端） */
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const t = e.touches[0];
  if (state === "playing" && player.grounded) {
    charging = true; power = 0; startX = t.clientX;
    dDir = 0; dOff = 0; updatePreview();
  }
}, {passive:false});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (!charging) return;
  const t = e.touches[0];
  const dx = t.clientX - startX, maxD = 80;
  dOff = Math.min(Math.abs(dx)/maxD, 1)*100;
  dDir = dx < -10 ? 1 : dx > 10 ? -1 : 0;
  updatePreview();
}, {passive:false});
canvas.addEventListener("touchend", e => {
  e.preventDefault();
  if (!charging) return;
  charging = false;
  if (power >= MIN_CHARGE && player.grounded) {
    player.vy = pvy; player.vx = pvx; player.grounded = false;
    spawnPart(player.x+PS/2, player.y+PS, "rgba(180,200,255)", 5);
  }
  power = 0; dDir = 0; dOff = 0;
}, {passive:false});

/* ─── 主循环 ─── */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
